<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Гелиус Синерджи — экосистема ИИ-агентов Корпорации «Синергия»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200;300;400&family=Golos+Text:wght@400;500&family=JetBrains+Mono:wght@300;400&display=swap">
<style>
:root{
  --ink:#07080A; --l0:#0A0B0F; --l1:#0C0E12; --l2:#0F1218; --l3:#12151B; --l4:#1A1E26;
  --sol:#FF3B20; --sol-d:#7A1206;
  --t1:rgba(242,240,237,1); --t2:rgba(242,240,237,.62); --t3:rgba(242,240,237,.38); --t4:rgba(242,240,237,.24);
  --hair:rgba(242,240,237,.10);
  --R:7px;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ink); color:var(--t1);
  font-family:'Golos Text','Segoe UI',system-ui,sans-serif;
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
.mono{font-family:'JetBrains Mono',ui-monospace,'Cascadia Mono',monospace;font-variant-numeric:tabular-nums}
.disp{font-family:'Unbounded','Trebuchet MS',sans-serif}
button{font-family:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:none}
a{color:var(--t1);text-decoration:none}

#app{position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 50%,#101218 0%,var(--l0) 46%,var(--ink) 100%)}
#grain{position:fixed;inset:0;width:100%;height:100%;opacity:.035;mix-blend-mode:soft-light;pointer-events:none;z-index:90}

/* ---------- шапка ---------- */
header{position:fixed;left:40px;top:34px;z-index:60}
.wm{display:flex;align-items:center;gap:13px}
.wm .nm{font-size:16px;font-weight:300;letter-spacing:.30em;line-height:1}

/* ---------- переключатель вида ---------- */
#modes{position:fixed;right:40px;top:34px;z-index:60;display:flex;gap:2px;
  border:1px solid var(--hair);border-radius:calc(var(--R)*3)}
#modes button{padding:9px 17px;font-size:9px;letter-spacing:.22em;color:var(--t3);
  border-radius:calc(var(--R)*3);transition:color .18s,background .18s}
#modes button:hover{color:var(--t1)}
#modes button.on{color:var(--t1);background:rgba(242,240,237,.06)}

/* ---------- борта ---------- */
.rail{position:fixed;top:118px;width:238px;z-index:55;transition:opacity .32s var(--ease),transform .42s var(--ease)}
#railL{left:40px;opacity:0;visibility:hidden;transform:translateX(-12px);
  transition:opacity .24s var(--ease),transform .3s var(--ease),visibility .24s}
#railL.live{opacity:1;visibility:visible;transform:none}
#railR{right:40px;text-align:right}
.rail .cap{font-size:8.5px;letter-spacing:.28em;color:var(--t3)}
/* ---------- путь агента: спица со станциями ---------- */
.axis{margin-top:24px}
.stn{display:grid;grid-template-columns:24px 1fr;row-gap:10px;
  width:100%;padding:0 0 20px 24px;text-align:left;position:relative;
  cursor:pointer;transition:opacity .2s var(--ease)}
/* Сегмент спицы набран тем же штрихом, что и его кольцо на карте. */
.stn .seg{position:absolute;left:4px;top:4px;bottom:0;width:1px}
.stn:last-child .seg{bottom:auto;height:14px}
.stn .node{position:absolute;left:0;top:0;width:9px;height:9px;border-radius:50%;
  border:1px solid rgba(242,240,237,.32);background:var(--ink);
  transition:background .2s,border-color .2s,transform .2s var(--ease)}
.stn .lv{font-size:8px;letter-spacing:.2em;color:var(--t4);line-height:1.4}
.stn .nm{font-size:9.5px;letter-spacing:.2em;color:var(--t2);line-height:1.4}
.stn .dots{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px}
.stn .dots i{width:6px;height:6px;border-radius:50%;display:block;
  border:1px solid rgba(242,240,237,.5);transition:background .2s,border-color .2s}
.stn .dots i.goal{border-style:dashed;border-color:rgba(242,240,237,.2)}
.stn .dots .none{font-size:8px;letter-spacing:.2em;color:var(--t4)}
.stn:hover .node{border-color:rgba(242,240,237,.6)}
.stn:hover .nm{color:var(--t1)}
.stn.on .node{background:#F2F0ED;border-color:#F2F0ED;transform:scale(1.15)}
.stn.on .nm{color:var(--t1)}
.stn.on .dots i:not(.goal){background:rgba(242,240,237,.86);border-color:rgba(242,240,237,.86)}
/* Гасим тоном, а не прозрачностью: прозрачность нужна анимации всхода. */
.axis.picked .stn:not(.on) .nm{color:var(--t4)}
.axis.picked .stn:not(.on) .lv{color:rgba(242,240,237,.14)}
.axis.picked .stn:not(.on) .node{border-color:rgba(242,240,237,.16)}
.axis.picked .stn:not(.on) .dots i{border-color:rgba(242,240,237,.16)}
.tale{margin-top:8px;font-size:11.5px;line-height:1.78;color:rgba(242,240,237,.5);
  text-wrap:pretty;min-height:1px}

.rail .rows{margin-top:20px;display:flex;flex-direction:column}
.rw{display:flex;align-items:baseline;gap:11px;padding:10px 8px;border-top:1px solid rgba(242,240,237,.07);
  cursor:crosshair;transition:background .18s,padding .22s var(--ease);width:100%;text-align:left}
#railR .rw{text-align:right}
.rw:last-child{border-bottom:1px solid rgba(242,240,237,.07)}
.rw.on{background:rgba(242,240,237,.04)}
#railL .rw.on{padding-left:14px}
#railR .rw.on{padding-right:14px}
.rw .k{flex:1 1 auto;font-size:10px;letter-spacing:.17em;color:var(--t2)}
.rw .lv{font-size:8px;letter-spacing:.16em;color:var(--t4);flex:0 0 auto}
.rw .ct{font-size:12px;color:var(--t2);flex:0 0 22px;text-align:right}
.rw.nil .k,.rw.nil .ct{color:var(--t4)}
.rail .note{margin-top:22px;font-size:10px;line-height:1.8;color:var(--t3)}

/* ---------- сцена ---------- */
#stage{position:fixed;inset:0;z-index:20;cursor:crosshair;transition:opacity .42s var(--ease),transform .52s var(--ease)}
#stage.back{opacity:.07;transform:scale(.94);filter:blur(3px);pointer-events:none}
#svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
/* Штрих несёт зрелость: реестр почти пунктир, автономная — сплошная.
   Заселённость ушла в яркость, чтобы два канала не спорили за одну линию. */
.ring{fill:none;stroke:rgba(242,240,237,.24);stroke-width:1;
  transition:stroke .2s,stroke-width .2s}
.ring.void{stroke:rgba(242,240,237,.10)}
.ring.goal{stroke:rgba(242,240,237,.30)}
.ring.on{stroke:rgba(242,240,237,.52);stroke-width:1.5}
.spoke{stroke:rgba(242,240,237,.07);stroke-width:1}
.wedge{fill:rgba(242,240,237,0);transition:fill .24s var(--ease)}
.wedge.on{fill:rgba(242,240,237,.028)}
.chord{fill:none;stroke:rgba(242,240,237,.3);stroke-width:1;stroke-dasharray:3 5}

.catlab{position:absolute;z-index:24;pointer-events:none;width:146px;
  font-size:9px;letter-spacing:.19em;line-height:1.5;color:var(--t3);
  transition:color .22s,opacity .22s}
.catlab.on{color:var(--t2)}
.catlab .cc{display:block;margin-top:4px;font-size:9px;color:var(--t4)}

/* Солнце */
#sun{position:absolute;z-index:26;pointer-events:none}
#sun .halo{position:absolute;border-radius:50%;
  background:radial-gradient(circle,color-mix(in oklab,var(--sol) 11%,transparent) 0%,transparent 58%);
  animation:breathe 6s cubic-bezier(.4,0,.6,1) infinite}
#sun .corona{position:absolute;left:-31px;top:-31px;width:62px;height:62px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in oklab,var(--sol) 46%,var(--sol-d)) 0%,transparent 72%);filter:blur(5px)}
#sun .core{position:absolute;left:-15px;top:-15px;width:30px;height:30px;border-radius:50%;
  background:radial-gradient(circle at 38% 34%,#FFD8CF 0%,var(--sol) 38%,var(--sol-d) 100%);
  box-shadow:0 0 22px color-mix(in oklab,var(--sol) 42%,transparent)}
#sun .cap{position:absolute;left:-110px;width:220px;text-align:center;
  font-size:8px;letter-spacing:.32em;color:var(--t4)}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.07);opacity:1}}

/* агенты */
.ag{position:absolute;left:0;top:0;width:32px;height:32px;z-index:30;color:var(--t1);
  transition:opacity .2s var(--ease)}
body.nw .ag{width:44px;height:44px}
.ag .glyph{position:absolute;left:5px;top:5px;display:block}
body.nw .ag .glyph{left:11px;top:11px}
.ag .ho{position:absolute;left:1px;top:1px;width:30px;height:30px;border-radius:50%;
  border:1px solid transparent;transition:border-color .18s,transform .2s var(--ease)}
.ag:focus-visible .ho{border-color:rgba(242,240,237,.72);transform:scale(1.16)}
body.nw .ag .ho{left:7px;top:7px}
.ag:hover .ho{border-color:rgba(242,240,237,.3)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes ctxin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes stnin{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
@keyframes crawl{to{stroke-dashoffset:var(--crawl,-12px)}}

/* Строки контекста всходят по очереди — читатель успевает за текстом. */
#ctx.on .eye{animation:ctxin .46s var(--ease) both}
#ctx.on .ttl{animation:ctxin .46s var(--ease) .05s both}
#ctx.on .say{animation:ctxin .46s var(--ease) .10s both}
#ctx.on .tbl .r:nth-child(1){animation:ctxin .46s var(--ease) .14s both}
#ctx.on .tbl .r:nth-child(2){animation:ctxin .46s var(--ease) .19s both}
#ctx.on .tbl .r:nth-child(3){animation:ctxin .46s var(--ease) .24s both}
#ctx.on .tbl .r:nth-child(4){animation:ctxin .46s var(--ease) .29s both}
#ctx.on .tbl .r:nth-child(5){animation:ctxin .46s var(--ease) .34s both}
#ctx.on .foot{animation:ctxin .46s var(--ease) .40s both}

/* Станции приходят каскадом сверху вниз, вдоль самой спицы. */
#railL.live .stn:nth-child(1){animation:stnin .5s var(--ease) .02s both}
#railL.live .stn:nth-child(2){animation:stnin .5s var(--ease) .07s both}
#railL.live .stn:nth-child(3){animation:stnin .5s var(--ease) .12s both}
#railL.live .stn:nth-child(4){animation:stnin .5s var(--ease) .17s both}
#railL.live .stn:nth-child(5){animation:stnin .5s var(--ease) .22s both}
#railL.live .tale{animation:ctxin .5s var(--ease) .3s both}

/* Штрих выбранного кольца медленно ползёт: кольцо живое, а не подсвеченное. */
.ring.on{animation:crawl var(--crawlDur,4s) linear infinite}

/* Мон агента под курсором чуть раскрывается. */
.ag .glyph{transition:transform .26s var(--ease)}
.ag.hot .glyph{transform:scale(1.16)}
.ag.hot .ho{border-color:rgba(242,240,237,.42)}

@media (prefers-reduced-motion:reduce){
  #ctx.on .eye,#ctx.on .ttl,#ctx.on .say,#ctx.on .tbl .r,#ctx.on .foot,
  #railL.live .stn,#railL.live .tale,.acard,.nd,#ctx{animation:none!important}
  .ring.on{animation:none}
  #sun .halo{animation:none}
  #beat{animation:none}
  .ag .glyph{transition:none}
}

/* ---------- контекст у курсора ----------
   Ни рамки, ни плашки: поле размытия, у которого нет края — маска гасит
   и размытие, и подложку. Иерархия держится светом и интервалом; вертикальная
   граница возникает выравниванием колонок, а не линией. */
#ctx{position:fixed;z-index:78;pointer-events:none;width:322px;
  opacity:0;visibility:hidden;transition:opacity .22s var(--ease)}
#ctx.on{opacity:1;visibility:visible}

#ctx .eye{display:flex;align-items:center;gap:11px}
#ctx .eye .g{flex:0 0 auto;display:block;color:rgba(242,240,237,.5)}
#ctx .eye .n{font-size:8px;letter-spacing:.28em;color:var(--t3)}

/* Дисплейный голос вернулся: имя набрано Unbounded, как позывные в досье. */
#ctx .ttl{margin-top:18px;font-family:'Unbounded','Trebuchet MS',sans-serif;
  font-size:19px;font-weight:300;line-height:1.32;letter-spacing:.03em}
#ctx .ttl .lv{display:block;margin-top:9px;font-family:'JetBrains Mono',ui-monospace,monospace;
  font-size:9px;letter-spacing:.24em;color:var(--t3)}
#ctx .say{margin-top:20px;font-size:12px;line-height:1.75;color:rgba(242,240,237,.5);
  text-wrap:pretty}

/* Интервалы неравные: группа свойств отбита от имени сильнее, чем строки
   внутри группы. Вертикальная линейка возникает выравниванием колонок. */
#ctx .tbl{margin:30px 0 0;display:flex;flex-direction:column;gap:13px}
#ctx .tbl .r{display:flex;gap:20px;align-items:baseline}
#ctx .tbl dt{flex:0 0 84px;margin:0;font-size:8px;letter-spacing:.2em;
  color:var(--t4);text-align:right;line-height:1.7}
#ctx .tbl dd{flex:1 1 auto;margin:0;font-size:12px;line-height:1.55;
  color:rgba(242,240,237,.86);font-variant-numeric:tabular-nums}
#ctx .foot{margin-top:30px;display:flex;gap:20px}
#ctx .foot .l{flex:0 0 84px;font-size:8px;letter-spacing:.2em;color:var(--t3);text-align:right}
#ctx .foot .r{flex:1 1 auto;font-size:8px;letter-spacing:.2em;color:var(--t4)}
#ctx.attn .eye .n,#ctx.attn .eye .g{color:var(--sol)}

/* Левое поле зеркалит: ярлыки прижаты к диаграмме, туда же приходит выноска. */
#ctx.left{text-align:right}
#ctx.left .eye{flex-direction:row-reverse}
#ctx.left .tbl .r,#ctx.left .foot{flex-direction:row-reverse}
#ctx.left .tbl dt,#ctx.left .foot .l{text-align:left}

.ctxlead{fill:none;stroke-width:1}
.rail{transition:opacity .26s var(--ease),transform .32s var(--ease)}
.rail.away{opacity:0;pointer-events:none}
#railL.away{transform:translateX(-14px)}
#railR.away{transform:translateX(14px)}

/* ---------- анатомия ---------- */
#anat{position:fixed;inset:0;z-index:40;opacity:0;pointer-events:none;
  transition:opacity .42s var(--ease)}
#anat.on{opacity:1;pointer-events:auto}
#anatSvg{position:absolute;inset:0;width:100%;height:100%}
.leader{stroke-width:1;fill:none}
.bound{fill:none;stroke:rgba(242,240,237,.09);stroke-width:1;stroke-dasharray:2 8}
#beat{position:absolute;border-radius:50%;border:1px solid rgba(242,240,237,.11);
  animation:spin linear infinite;z-index:42}
#beat .p{position:absolute;left:50%;top:-2.5px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;
  background:rgba(242,240,237,.72);box-shadow:0 0 9px rgba(242,240,237,.5)}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
#acore{position:absolute;z-index:46;border-radius:50%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:9px;padding:0 18px;text-align:center;
  background:radial-gradient(circle at 40% 34%,#14171E 0%,#0E1116 62%,#090B0F 100%);
  border:1px solid rgba(242,240,237,.14)}
#acore .chip{padding:3px 10px;border-radius:var(--R);border:1px solid rgba(242,240,237,.14);
  background:rgba(7,8,10,.55);font-size:7px;letter-spacing:.24em;color:var(--t2)}
#acore .cl{font-size:11px;font-weight:300;letter-spacing:.06em;line-height:1.45}
body.nw #acore{padding:0 14px;gap:7px}
body.nw #acore .cl{font-size:10px;line-height:1.4;letter-spacing:.03em}
body.nw #acore .chip{font-size:6.5px;letter-spacing:.18em;padding:2px 8px}
.nd{position:absolute;width:26px;height:26px;z-index:48;color:var(--t1)}
.nd .dot{position:absolute;left:6px;top:6px;width:14px;height:14px;border-radius:50%;
  background:var(--l0);border:1.5px solid var(--dc,rgba(242,240,237,.9));
  box-shadow:var(--dg,0 0 12px rgba(242,240,237,.3));
  transition:background .18s,transform .2s var(--ease)}
.nd:hover .dot,.nd:focus-visible .dot{background:var(--dc,rgba(242,240,237,.9));transform:scale(1.22)}
.nd.slot .dot{border-style:dashed;border-width:1px;box-shadow:none}
.nlab{position:absolute;z-index:47;pointer-events:none}
.nlab .t{font-size:8px;letter-spacing:.24em;color:var(--t3)}
.nlab .v{margin-top:5px;font-size:11.5px;font-weight:500;line-height:1.4}
.acard{position:absolute;z-index:52;width:276px;
  pointer-events:none;animation:rise .18s var(--ease)}
.acard::before{content:'';position:absolute;inset:-48px -70px -54px -70px;z-index:-1;
  background:rgba(5,6,8,.88);
  -webkit-mask-image:linear-gradient(to right, transparent 0, #000 15%, #000 85%, transparent 100%),
    linear-gradient(to bottom, transparent 0, #000 16%, #000 84%, transparent 100%);
  -webkit-mask-composite:source-in;
  mask-image:linear-gradient(to right, transparent 0, #000 15%, #000 85%, transparent 100%),
    linear-gradient(to bottom, transparent 0, #000 16%, #000 84%, transparent 100%);
  mask-composite:intersect}
.acard .h{font-size:7.5px;letter-spacing:.24em;color:var(--t3)}
.acard .b{margin-top:14px;font-size:11px;line-height:1.65;color:var(--t2)}
.flank{position:fixed;top:50%;transform:translateY(-50%);width:270px;z-index:50}
.flank h2{margin:0;font-size:12px;font-weight:300;letter-spacing:.28em}
.flank p{margin:16px 0 0;font-size:12px;line-height:1.9;color:rgba(242,240,237,.55);
  text-align:justify;hyphens:auto}
.flank.l{left:40px;text-align:right}
.flank.l h2{border-right:1px solid rgba(242,240,237,.5);padding-right:13px}
.flank.r{right:40px;text-align:left}
.flank.r h2{border-left:1px solid rgba(242,240,237,.5);padding-left:13px}
#back{position:fixed;left:40px;top:34px;z-index:62;display:flex;align-items:center;gap:11px;
  font-size:9px;letter-spacing:.22em;color:var(--t3);opacity:0;pointer-events:none;transition:opacity .3s}
#back.on{opacity:1;pointer-events:auto}
#back:hover{color:var(--t1)}

/* ---------- показатели ---------- */
#mx{position:fixed;inset:0;z-index:45;opacity:0;pointer-events:none;overflow-y:auto;
  transition:opacity .42s var(--ease)}
#mx.on{opacity:1;pointer-events:auto}
.mxin{max-width:1180px;margin:0 auto;padding:132px 40px 70px}
.mxh{font-size:11px;letter-spacing:.3em;color:var(--t4)}
.tg{margin-top:26px;display:grid;grid-template-columns:1fr;gap:1px;background:rgba(242,240,237,.08)}
.tgr{display:grid;grid-template-columns:2.1fr repeat(3,1fr);background:var(--l2)}
.tgr>div{padding:17px 18px}
.tgr.hd>div{padding:12px 18px;font-size:8px;letter-spacing:.22em;color:var(--t4)}
.tgr .nmx{font-size:12px;color:var(--t2);line-height:1.45}
.tgr .vx{font-size:19px;font-weight:300}
.bar{margin-top:9px;height:2px;background:rgba(242,240,237,.10);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:0;background:rgba(242,240,237,.5);
  transition:width 1.1s var(--ease)}
.bar.hot i{background:var(--sol)}
.fn{margin-top:58px}
.steps{margin-top:24px;display:grid;grid-template-columns:repeat(7,1fr);gap:14px}
.stp{padding:17px 15px 18px;border-top:1px solid rgba(242,240,237,.16);position:relative}
.stp .no{font-size:8px;letter-spacing:.2em;color:var(--t4)}
.stp .ti{margin-top:9px;font-size:11.5px;font-weight:500;line-height:1.35}
.stp .rs{margin-top:9px;font-size:9.5px;line-height:1.5;color:var(--t3)}
.stp .rp{margin-top:11px;font-size:8px;letter-spacing:.13em;color:var(--t4);line-height:1.5}
.stp.live{border-top-color:rgba(242,240,237,.55)}
.stp.live .ti{color:var(--t1)}
.cons{margin-top:58px;display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.cn{padding:22px 22px 24px;border:1px solid rgba(242,240,237,.10);border-radius:calc(var(--R)*2);background:rgba(242,240,237,.014)}
.cn .cnh{font-size:8px;letter-spacing:.22em;color:var(--t4)}
.cn p{margin:13px 0 0;font-size:11.5px;line-height:1.65;color:var(--t2)}
.cn.hot{border-color:color-mix(in oklab,var(--sol) 42%,transparent)}
.cn.hot .cnh{color:var(--sol)}

/* Матрица вращается как одно целое. Угол кодирует категорию, поэтому агент
   не вправе уезжать из своего сектора: секторы, спицы и подписи поворачиваются
   тем же углом, что и агенты. Разные скорости по кольцам это правило нарушали. */
var spin = 0;
var SPIN_T = 220;
var lastT = 0, raf = 0;

var byCat = {}, byStage = {};
CATS.forEach(function(c){ byCat[c.k] = []; });
STAGES.forEach(function(s){ byStage[s.k] = 0; });
A.forEach(function(a){ byCat[a.c].push(a); byStage[a.s] += 1; });

var SLOTS = [
  { k:'role', t:'РОЛЬ',          a:-90, pos:'top' },
  { k:'ef',   t:'ЭФФЕКТ',        a:-35, pos:'r' },
  { k:'cat',  t:'ЛИНЕЙКА',       a:35,  pos:'r' },
  { k:'st',   t:'СТАДИЯ',        a:90,  pos:'bot' },
  { k:'unit', t:'БЛОК ВНЕДРЕНИЯ', a:145, pos:'l' },
  { k:'sys',  t:'СИСТЕМЫ',       a:215, pos:'l' }
];

function cat(k){ for (var i=0;i<CATS.length;i++) if (CATS[i].k===k) return CATS[i]; return CATS[0]; }
function stg(k){ for (var i=0;i<STAGES.length;i++) if (STAGES[i].k===k) return STAGES[i]; return STAGES[0]; }
function agent(id){ for (var i=0;i<A.length;i++) if (A[i].id===id) return A[i]; return null; }
function el(t,c){ var e=document.createElement(t); if(c) e.className=c; return e; }
function ns(t){ return document.createElementNS('http://www.w3.org/2000/svg',t); }

/* Сектор категории пропорционален числу агентов в ней: ширина сектора
   и есть вес линейки. Одиночная категория получает минимум, иначе в неё
   не попасть курсором. */
var WSUM = 0;
CATS.forEach(function(c){ c._w = Math.max(1.7, byCat[c.k].length); WSUM += c._w; });
var acc = -90;
CATS.forEach(function(c){ c.a0 = acc; c.aw = c._w / WSUM * 360; acc += c.aw; });

/* базовый угол агента внутри своего сектора и кольца */
A.forEach(function(a){
  var c = cat(a.c);
  var peers = byCat[a.c].filter(function(x){ return x.s === a.s; });
  var idx = peers.indexOf(a);
  var n = peers.length;
  var pad = c.aw * 0.15;
  var span = c.aw - pad * 2;
  a.a0 = c.a0 + pad + (n === 1 ? span / 2 : span * idx / (n - 1));
});

/* ============================= ГЕОМЕТРИЯ ============================= */

function measure(){
  st.W = window.innerWidth; st.H = window.innerHeight;
  st.narrow = st.W < 1100;
  document.body.classList.toggle('nw', st.narrow);
  if (st.narrow) {
    /* Телефон: матрица — квадратный блок в потоке, остальное листается под ним.
       Орбиты стоят: на касании точность важнее движения. */
    st.box = Math.min(st.W - 20, 560);
    stageEl.style.height = st.box + 'px';
    if (anatBox) anatBox.style.height = st.box + 'px';
    st.cx = st.W / 2; st.cy = st.box / 2;
    st.R = Math.max(120, Math.min(st.W / 2 - 26, st.box / 2 - 26));
  } else {
    stageEl.style.height = '';
    if (anatBox) anatBox.style.height = '';
    var availW = st.W - 636;
    var availH = st.H - 210;
    st.R = Math.max(150, Math.min(availW / 2 - 56, availH / 2 - 34));
    st.cx = st.W / 2; st.cy = 118 + availH / 2;
  }
}

/* ============================= БОРТА ============================= */

/* Станция выше самой зрелой заселённой — призрак: путь туда не пройден. */
function topReached(){
  for (var i = 0; i < STAGES.length; i++) if (byStage[STAGES[i].k]) return i;
  return STAGES.length;
}

function buildAxis(){
  var box = document.getElementById('axis');
  box.textContent = '';
  var reached = topReached();
  STAGES.forEach(function(s, i){
    var b = el('button','stn' + (i < reached ? ' ghost' : ''));
    b.type = 'button';
    b.dataset.k = s.k;
    var n = byStage[s.k] || 0;
    b.setAttribute('aria-label', s.n + (s.lv !== '—' ? ', ' + s.lv : '') + ', агентов: ' + n);

    var seg = el('span','seg');
    if (!s.dash || s.dash === 'none'){
      seg.style.background = 'rgba(242,240,237,.24)';
    } else {
      var f = s.dash.split(' ');
      var a1 = parseFloat(f[0]), a2 = parseFloat(f[1]);
      seg.style.background = 'repeating-linear-gradient(to bottom,'
        + ' rgba(242,240,237,' + (byStage[s.k] ? '.24' : '.12') + ') 0 ' + a1 + 'px,'
        + ' transparent ' + a1 + 'px ' + (a1 + a2) + 'px)';
    }
    b.appendChild(seg);
    b.appendChild(el('span','node'));
    var lv = el('span','lv mono'); lv.textContent = s.lv !== '—' ? s.lv : '';
    var nm = el('span','nm mono'); nm.textContent = s.n;
    var dots = el('span','dots');
    for (var k = 0; k < n; k++) dots.appendChild(el('i'));
    var goal = (s.goal || 0) - n;
    for (var g = 0; g < goal; g++) dots.appendChild(el('i','goal'));
    if (!n && !s.goal){ var z = el('span','none mono'); z.textContent = '—'; dots.appendChild(z); }

    b.appendChild(lv); b.appendChild(nm); b.appendChild(dots);
    b.addEventListener('click', function(){
      st.pick = (st.pick === s.k) ? null : s.k;
      axisSync(); paint();
    });
    box.appendChild(b);
  });
  axisSync();
}

/* Спица проявляется при наведении на кольцо или на агента и держится, пока
   стадия выбрана кликом или курсор внутри самой колонки. */
function axisSync(){
  var h = st.hover;
  var fromHover = h && (h.kind === 'stage' || h.kind === 'agent');
  var show = !st.narrow && (!!st.pick || st.overAxis || !!fromHover);
  var railL = document.getElementById('railL');
  railL.classList.toggle('live', !!show && !railL.classList.contains('away'));

  var mark = st.pick;
  if (!mark && fromHover){
    mark = (h.kind === 'stage') ? h.id : agent(h.id).s;
  }
  /* Длинный рассказ — только когда стадия выбрана или наведена как кольцо:
     при наведении на агента справа уже есть его карточка. */
  paintAxis(mark, !!st.pick || (h && h.kind === 'stage'));
}

/* Рассказ о стадии — в пустоте под спицей, без плашки и без рамки. */
function paintAxis(mark, withTale){
  if (mark === undefined) mark = st.pick;
  var box = document.getElementById('axis');
  box.classList.toggle('picked', !!mark);
  box.querySelectorAll('.stn').forEach(function(b){
    b.classList.toggle('on', b.dataset.k === mark);
  });
  var tale = document.getElementById('tale');
  if (!mark || !withTale){ tale.textContent = ''; return; }
  var s = stg(mark), n = byStage[mark] || 0;
  var word = (n % 10 === 1 && n % 100 !== 11) ? 'агент'
    : ((n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? 'агента' : 'агентов');
  var t = s.note + ' ';
  t += n ? ('Сейчас на этом кольце ' + n + ' ' + word + '.') : 'Сейчас кольцо пустое.';
  if (s.goalNote) t += ' ' + s.goalNote;
  tale.textContent = t;
}

function buildRails(){

  var R = document.getElementById('catRows'); R.textContent='';

    b.dataset.cat = c.k;
    b.innerHTML = '<span class="k mono">'+c.n+'</span><span class="ct mono">'+byCat[c.k].length+'</span>';

      if (e && e.clientX){ st.mx = e.clientX; st.my = e.clientY; }
      setHover({ kind:'cat', id:c.k }, 'railR');
      ctxPlace();
    };
    b.addEventListener('mouseenter', enterC);
    b.addEventListener('mousemove', enterC);
    b.addEventListener('mouseleave', function(){ setHover(null); });
    b.addEventListener('focus', enterC);
    b.addEventListener('blur', function(){ setHover(null); });
    R.appendChild(b);
  });
  note();
}

function note(){

var svg = document.getElementById('svg');
var stageEl = document.getElementById('stage');
var ctxEl = document.getElementById('ctx');
var agEls = [], catLabs = [];
var POS = {};

function buildStage(){
  svg.textContent = '';
  agEls.forEach(function(e){ e.remove(); });
  catLabs.forEach(function(e){ e.remove(); });
  agEls = []; catLabs = [];

  var defs = ns('defs');
  var lg = ns('linearGradient');
  lg.setAttribute('id','ctxLead'); lg.setAttribute('gradientUnits','userSpaceOnUse');
  var st0 = ns('stop'); st0.setAttribute('offset','0');
  st0.setAttribute('stop-color','#F2F0ED'); st0.setAttribute('stop-opacity','0');
  var st1 = ns('stop'); st1.setAttribute('offset','1');
  st1.setAttribute('stop-color','#F2F0ED'); st1.setAttribute('stop-opacity','0.34');
  lg.appendChild(st0); lg.appendChild(st1); defs.appendChild(lg);
  svg.appendChild(defs);
  svg._leadG = lg;

  var gWedge = ns('g'), gRing = ns('g'), gSpoke = ns('g'), gChord = ns('g');
  svg.appendChild(gWedge); svg.appendChild(gSpoke); svg.appendChild(gRing);
  svg.appendChild(gChord);
  var lead = ns('path'); lead.setAttribute('class','ctxlead');
  lead.setAttribute('stroke','url(#ctxLead)'); lead.setAttribute('opacity','0');
  svg.appendChild(lead); svg._lead = lead;
  svg.dataset.ready = '1';
  svg._w = gWedge; svg._r = gRing; svg._s = gSpoke; svg._c = gChord;

  /* клинья категорий */
  CATS.forEach(function(c,i){
    var p = ns('path'); p.setAttribute('class','wedge'); p.dataset.cat = c.k;
    gWedge.appendChild(p);
  });
  /* спицы */
  CATS.forEach(function(){ var l = ns('line'); l.setAttribute('class','spoke'); gSpoke.appendChild(l); });
  /* кольца */
  STAGES.forEach(function(s){
    var c = ns('circle'); c.setAttribute('class','ring'); c.dataset.stage = s.k; gRing.appendChild(c);
  });

  /* подписи категорий */
  CATS.forEach(function(c){
    var d = el('div','catlab'); d.dataset.cat = c.k;
    d.innerHTML = '<span>'+c.n+'</span><span class="cc mono">'+byCat[c.k].length+'</span>';
    stageEl.appendChild(d); catLabs.push(d);
  });

  /* агенты */
  A.forEach(function(a){
    var b = el('button','ag');
    b.type = 'button';
    b.setAttribute('aria-label', a.n + ' — ' + cat(a.c).n + ', ' + stg(a.s).n);
    var ho = el('span','ho'); b.appendChild(ho);
    var g = ns('svg'); g.setAttribute('class','glyph'); g.setAttribute('width','22');
    g.setAttribute('height','22'); g.setAttribute('viewBox','0 0 24 24'); g.setAttribute('aria-hidden','true');
    var ring = ns('circle');
    ring.setAttribute('cx','12'); ring.setAttribute('cy','12'); ring.setAttribute('r','9');
    ring.setAttribute('fill','none'); ring.setAttribute('stroke','currentColor');
    ring.setAttribute('stroke-width','1.6');
    if (a.thin) ring.setAttribute('stroke-dasharray','2.6 2.6');
    g.appendChild(ring);
    cat(a.c).mon.forEach(function(d){
      var p = ns('path'); p.setAttribute('d',d); p.setAttribute('fill','none');
      p.setAttribute('stroke','currentColor'); p.setAttribute('stroke-width','1.6');
      p.setAttribute('stroke-linecap','round'); p.setAttribute('stroke-linejoin','round');
      g.appendChild(p);
    });
    b.appendChild(g);
    b.addEventListener('focus', function(){
      setHover({ kind:'agent', id:a.id });
      ctxPlace();
    });
    b.addEventListener('blur', function(){ setHover(null); });
    b.addEventListener('click', function(){
      if (st.narrow) openSheet(a.id); else openAnat(a.id);
    });
    stageEl.appendChild(b);
    a._el = b; a._ring = ring;
    agEls.push(b);
  });
}

function pos(a){
  var s = stg(a.s);
  var th = (spin + a.a0) * Math.PI / 180;
  var r = st.R * s.rf;
  return [ st.cx + r * Math.cos(th), st.cy + r * Math.sin(th) ];
}

function paint(){
  var sun = document.getElementById('sun');
  sun.style.left = st.cx + 'px'; sun.style.top = st.cy + 'px';
  var hr = st.R * 0.34;
  var hl = sun.querySelector('.halo');
  hl.style.width = (hr*2)+'px'; hl.style.height = (hr*2)+'px';
  hl.style.left = (-hr)+'px'; hl.style.top = (-hr)+'px';
  sun.querySelector('.cap').style.top = (st.R*0.155)+'px';

  var hA = st.hoverAgent ? agent(st.hoverAgent) : null;
  var hC = hA ? hA.c : st.hoverCat;
  var hS = st.hoverStage;

  /* клинья и спицы */
  var wedges = svg._w.childNodes, spokes = svg._s.childNodes;
  CATS.forEach(function(c,i){
    var a0 = (c.a0 + spin) * Math.PI/180, a1 = (c.a0 + c.aw + spin) * Math.PI/180;
    var Rr = st.R * 1.04;
    var x0 = st.cx + Rr*Math.cos(a0), y0 = st.cy + Rr*Math.sin(a0);
    var x1 = st.cx + Rr*Math.cos(a1), y1 = st.cy + Rr*Math.sin(a1);
    var w = wedges[i];
    w.setAttribute('d','M'+st.cx+' '+st.cy+' L'+x0.toFixed(1)+' '+y0.toFixed(1)+
      ' A'+Rr.toFixed(1)+' '+Rr.toFixed(1)+' 0 '+(c.aw>180?1:0)+' 1 '+
      x1.toFixed(1)+' '+y1.toFixed(1)+' Z');
    w.setAttribute('class','wedge' + (hC===c.k ? ' on' : ''));
    var sp = spokes[i];
    sp.setAttribute('x1', st.cx); sp.setAttribute('y1', st.cy);
    sp.setAttribute('x2', x0.toFixed(1)); sp.setAttribute('y2', y0.toFixed(1));

    /* подпись категории */
    var mid = (c.a0 + c.aw/2 + spin) * Math.PI/180;
    var lr = st.R * 1.07;
    var lx = st.cx + lr*Math.cos(mid), ly = st.cy + lr*Math.sin(mid);
    var d = catLabs[i];
    var right = Math.cos(mid) >= 0;
    d.style.left = (right ? lx : lx - 146) + 'px';
    d.style.top = (ly - 14) + 'px';
    d.style.textAlign = right ? 'left' : 'right';
    d.className = 'catlab' + (hC===c.k ? ' on' : '');
    d.style.opacity = (hC && hC !== c.k) ? .10 : (st.hover ? 1 : .8);
  });

  /* кольца */
  var rings = svg._r.childNodes;
  STAGES.forEach(function(s,i){
    var r = st.R * s.rf;
    var c = rings[i];
    c.setAttribute('cx', st.cx); c.setAttribute('cy', st.cy); c.setAttribute('r', r.toFixed(1));
    c.setAttribute('stroke-dasharray', s.dash || 'none');
    if (s.dash && s.dash !== 'none'){
      /* Один цикл = один период штриха, скорость одна для всех колец:
         тогда на стыке цикла нет рывка. */
      var per = s.dash.split(' ').reduce(function(x, y){ return x + parseFloat(y); }, 0);
      c.style.setProperty('--crawl', (-per) + 'px');
      c.style.setProperty('--crawlDur', (per / 3).toFixed(2) + 's');
    }
    c.setAttribute('class','ring'
      + (byStage[s.k]===0 ? (s.goal ? ' goal' : ' void') : '')
      + ((hS===s.k || st.pick===s.k) ? ' on':''));
  });

  /* агенты */
  var P = POS;
  A.forEach(function(a){
    var p = pos(a); P[a.id] = p;
    var op = 1;
    if (hA) op = (a.id === hA.id) ? 1 : (a.c === hA.c ? .78 : .18);
    else if (hC) op = (a.c === hC) ? 1 : .2;
    else if (hS) op = (a.s === hS) ? 1 : .26;
    else if (st.pick) op = (a.s === st.pick) ? 1 : .18;
    op = Math.max(.16, op);
    var col = a.attn ? 'var(--sol)' : 'rgba(242,240,237,.92)';
    var e = a._el;
    var half = st.narrow ? 22 : 16;
    e.style.transform = 'translate('+(p[0]-half).toFixed(1)+'px,'+(p[1]-half).toFixed(1)+'px)';
    e.style.opacity = op.toFixed(2);
    e.style.color = col;
    e.style.zIndex = (hA && a.id===hA.id) ? 33 : 30;
    e.classList.toggle('hot', !!(hA && a.id === hA.id));
    e.querySelector('.ho').style.boxShadow = a.attn
      ? '0 0 16px color-mix(in oklab, var(--sol) 45%, transparent)' : 'none';
  });

  /* хорды: агенты одной категории */
  var g = svg._c; g.textContent = '';
  if (hA) {
    byCat[hA.c].forEach(function(o){
      if (o.id === hA.id) return;
      var Aa = P[hA.id], Bb = P[o.id];
      var qx = (Aa[0]+Bb[0])/2*0.4 + st.cx*0.6;
      var qy = (Aa[1]+Bb[1])/2*0.4 + st.cy*0.6;
      var p = ns('path'); p.setAttribute('class','chord');
      p.setAttribute('d','M'+Aa[0].toFixed(1)+' '+Aa[1].toFixed(1)+' Q'+qx.toFixed(1)+' '+qy.toFixed(1)+
        ' '+Bb[0].toFixed(1)+' '+Bb[1].toFixed(1));
      g.appendChild(p);
    });
  }

  /* синхронизация бортов */
  document.querySelectorAll('#catRows .rw').forEach(function(b){
    b.classList.toggle('on', b.dataset.cat === hC);
  });
}

/* ================= ПОПАДАНИЕ И КОНТЕКСТ У КУРСОРА =================
   Одна функция решает, что под курсором. Приоритет задан явно, а не
   порядком элементов в SVG: ядро > агент > кольцо > сектор. */

function stageXY(e){
  var r = stageEl.getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top];
}

function hitTest(x, y){
  var dx = x - st.cx, dy = y - st.cy;
  var r = Math.sqrt(dx*dx + dy*dy);

  if (r < Math.max(28, st.R * 0.10)) return { kind:'sun' };

  var best = null, bd = 1e9;
  for (var i = 0; i < A.length; i++){
    var q = POS[A[i].id];
    if (!q) continue;
    var d = Math.sqrt((x-q[0])*(x-q[0]) + (y-q[1])*(y-q[1]));
    if (d < bd) { bd = d; best = A[i]; }
  }
  if (best && bd <= 20) return { kind:'agent', id:best.id };

  for (var j = 0; j < STAGES.length; j++){
    if (Math.abs(r - st.R * STAGES[j].rf) <= 18) return { kind:'stage', id:STAGES[j].k };
  }

  if (r <= st.R * 1.16){
    var ang = Math.atan2(dy, dx) * 180 / Math.PI;
    for (var m = 0; m < CATS.length; m++){
      var off = ((ang - spin - CATS[m].a0) % 360 + 360) % 360;
      if (off < CATS[m].aw) return { kind:'cat', id:CATS[m].k };
    }
  }
  return null;
}

function sameHover(a, b){
  if (!a || !b) return a === b;
  return a.kind === b.kind && a.id === b.id;
}

function setHover(h, src){
  st.hoverSrc = h ? (src || 'map') : null;
  /* Уходит тот борт, чьё поле занимает контекст, и никогда — тот, на который
     сейчас наведён курсор. */
  var away = h && !st.narrow && st.hoverSrc === 'railR' ? 'railL'
    : (h && !st.narrow ? 'railR' : null);
  document.getElementById('railL').classList.toggle('away', away === 'railL');
  document.getElementById('railR').classList.toggle('away', away === 'railR');
  if (sameHover(st.hover, h)) return;
  st.hover = h;
  st.hoverAgent = (h && h.kind === 'agent') ? h.id : null;
  st.hoverStage = (h && h.kind === 'stage') ? h.id
    : (h && h.kind === 'agent') ? agent(h.id).s : null;
  st.hoverCat = (h && h.kind === 'cat') ? h.id : null;
  ctxRender();
  axisSync();
  paint();
  if (h) { ctxPlace(); leadDraw(); } else leadHide();
}

/* Точка привязки — сам элемент, а не курсор: текст встаёт в пустое поле,
   а выноска показывает, чьи это свойства. */
function anchorOf(h){
  var r = stageEl.getBoundingClientRect();
  if (h.kind === 'agent'){
    var q = POS[h.id];
    return q ? [r.left + q[0], r.top + q[1]] : [r.left + st.cx, r.top + st.cy];
  }
  if (h.kind === 'stage'){
    var th = Math.atan2(st.my - r.top - st.cy, st.mx - r.left - st.cx);
    var rr = st.R * stg(h.id).rf;
    return [r.left + st.cx + rr * Math.cos(th), r.top + st.cy + rr * Math.sin(th)];
  }
  if (h.kind === 'cat'){
    var c = cat(h.id);
    var mid = (c.a0 + c.aw / 2 + spin) * Math.PI / 180;
    var rr2 = st.R * 0.88;
    return [r.left + st.cx + rr2 * Math.cos(mid), r.top + st.cy + rr2 * Math.sin(mid)];
  }
  return [r.left + st.cx, r.top + st.cy];
}

function ctxPlace(){
  var h = st.hover;
  if (!h) { leadHide(); return; }
  var a = anchorOf(h);
  var w = 322, pad = 44;
  var hh = ctxEl.offsetHeight || 220;
  /* Контекст всегда стопкой в правой колонке. Единственное исключение —
     наведение на сам правый борт: блок не должен накрывать свой же триггер. */
  var side = (st.hoverSrc === 'railR') ? 'left' : 'right';

  var left = (side === 'right') ? (st.W - pad - w) : pad;
  var top = Math.max(96, Math.min(st.H - hh - 40, a[1] - hh * 0.34));

  ctxEl.classList.toggle('left', side === 'left');
  ctxEl.style.left = Math.round(left) + 'px';
  ctxEl.style.top = Math.round(top) + 'px';

  var innerX = (side === 'right') ? left : left + w;
  leadShow(a[0], a[1], innerX, top + 8);
}

/* Выноска не режет диск: короткий радиальный вынос от элемента, дуга по
   внешней границе до нужной стороны и прямой отвод к тексту. Так делают
   выносные линии на чертеже — линия нигде не пересекает предмет. */
function leadShow(ax, ay, bx, by){
  var l = svg._lead;
  if (!l) return;
  var r = stageEl.getBoundingClientRect();
  var x0 = ax - r.left, y0 = ay - r.top;
  var x1 = bx - r.left, y1 = by - r.top;

  var rOut = st.R * 1.14;
  var a0 = Math.atan2(y0 - st.cy, x0 - st.cx);
  var px = st.cx + rOut * Math.cos(a0), py = st.cy + rOut * Math.sin(a0);

  var dy = Math.max(-rOut * 0.985, Math.min(rOut * 0.985, y1 - st.cy));
  var a1 = Math.asin(dy / rOut);
  if (x1 < st.cx) a1 = Math.PI - a1;
  var qx = st.cx + rOut * Math.cos(a1), qy = st.cy + rOut * Math.sin(a1);

  var d = ((a1 - a0) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
  var sweep = d <= Math.PI ? 1 : 0;

  l.setAttribute('d',
    'M' + x0.toFixed(1) + ' ' + y0.toFixed(1) +
    ' L' + px.toFixed(1) + ' ' + py.toFixed(1) +
    ' A' + rOut.toFixed(1) + ' ' + rOut.toFixed(1) + ' 0 0 ' + sweep + ' ' +
    qx.toFixed(1) + ' ' + qy.toFixed(1) +
    ' L' + x1.toFixed(1) + ' ' + y1.toFixed(1));

  var g = svg._leadG;
  g.setAttribute('x1', x0.toFixed(1)); g.setAttribute('y1', y0.toFixed(1));
  g.setAttribute('x2', x1.toFixed(1)); g.setAttribute('y2', y1.toFixed(1));
  l.setAttribute('opacity', '1');

  /* Длина пути меняется на каждом движении курсора, поэтому пунктир под
     прочерчивание переустанавливаем без анимации; сам прочерк — в leadDraw. */
  var len = l.getTotalLength();
  l.setAttribute('stroke-dasharray', len.toFixed(1));
  if (!l._drawing) {
    l.style.transition = 'none';
    l.setAttribute('stroke-dashoffset', '0');
  }
}

/* Прочерк выноски — один раз на новую цель, а не на каждое движение. */
function leadDraw(){
  var l = svg._lead;
  if (!l || !l.getAttribute('d')) return;
  var len = l.getTotalLength();
  l._drawing = true;
  l.style.transition = 'none';
  l.setAttribute('stroke-dasharray', len.toFixed(1));
  l.setAttribute('stroke-dashoffset', len.toFixed(1));
  void l.getBoundingClientRect();
  l.style.transition = 'stroke-dashoffset .56s cubic-bezier(.22,1,.36,1)';
  l.setAttribute('stroke-dashoffset', '0');
  clearTimeout(l._t);
  l._t = setTimeout(function(){ l._drawing = false; }, 580);
}
function leadHide(){ if (svg._lead) svg._lead.setAttribute('opacity', '0'); }

/* Глифы контекста берутся из словаря самой карты: мон линейки, набор колец
   стадий, ядро. Иконок со стороны здесь нет. */
function svgBox(size){
  var g = ns('svg'); g.setAttribute('class','g');
  g.setAttribute('width', size); g.setAttribute('height', size);
  g.setAttribute('viewBox','0 0 24 24'); g.setAttribute('aria-hidden','true');
  return g;
}
function monGlyph(catKey){
  var g = svgBox(15), c = cat(catKey);
  var r = ns('circle'); r.setAttribute('cx','12'); r.setAttribute('cy','12'); r.setAttribute('r','9');
  r.setAttribute('fill','none'); r.setAttribute('stroke','currentColor'); r.setAttribute('stroke-width','2.1');
  g.appendChild(r);
  c.mon.forEach(function(d){
    var q = ns('path'); q.setAttribute('d', d); q.setAttribute('fill','none');
    q.setAttribute('stroke','currentColor'); q.setAttribute('stroke-width','2.1');
    q.setAttribute('stroke-linecap','round'); q.setAttribute('stroke-linejoin','round');
    g.appendChild(q);
  });
  return g;
}
function ringGlyph(stageKey){
  var g = svgBox(15);
  STAGES.forEach(function(s){
    var on = s.k === stageKey;
    var c = ns('circle');
    c.setAttribute('cx','12'); c.setAttribute('cy','12');
    c.setAttribute('r', (s.rf * 10.4).toFixed(1));
    c.setAttribute('fill','none'); c.setAttribute('stroke','currentColor');
    c.setAttribute('stroke-width', on ? '2.2' : '1');
    c.setAttribute('stroke-opacity', on ? '1' : '0.3');
    if (s.dash && s.dash !== 'none'){
      var f = s.dash.split(' ');
      c.setAttribute('stroke-dasharray',
        (parseFloat(f[0]) * 0.36).toFixed(1) + ' ' + (parseFloat(f[1]) * 0.36).toFixed(1));
    }
    g.appendChild(c);
  });
  return g;
}
function sunGlyph(){
  var g = svgBox(15);
  var c = ns('circle');
  c.setAttribute('cx','12'); c.setAttribute('cy','12'); c.setAttribute('r','5');
  c.setAttribute('fill','var(--sol)');
  g.appendChild(c);
  return g;
}

function ctxRender(){
  var h = st.hover;
  if (!h || st.narrow || st.mode !== 'eco'){
    ctxEl.classList.remove('on');
    return;
  }
  ctxEl.textContent = '';
  ctxEl.className = '';

  var K = function(t, glyph){
    var e = el('div','eye');
    if (glyph) e.appendChild(glyph);
    var n = el('span','n mono'); n.textContent = t; e.appendChild(n);
    ctxEl.appendChild(e);
  };
  var T = function(t, lv){
    var e = el('div','ttl'); e.textContent = t;
    if (lv){ var s2 = el('span','lv'); s2.textContent = lv; e.appendChild(s2); }
    ctxEl.appendChild(e);
  };
  var D = function(t){ var e = el('div','say'); e.textContent = t; ctxEl.appendChild(e); };
  var tbl = null;
  var R2 = function(l, v){
    if (!v) return;
    if (!tbl){ tbl = el('dl','tbl'); ctxEl.appendChild(tbl); }
    var row = el('div','r');
    var dt = el('dt','mono'); dt.textContent = l;
    var dd = el('dd'); dd.textContent = v;
    row.appendChild(dt); row.appendChild(dd); tbl.appendChild(row);
  };
  var F = function(left, right){
    if (!left && !right) return;
    var e = el('div','foot');
    var a1 = el('span','l mono'); a1.textContent = left || '';
    var a2 = el('span','r mono'); a2.textContent = right || '';
    e.appendChild(a1); e.appendChild(a2); ctxEl.appendChild(e);
  };

  if (h.kind === 'agent'){
    var a = agent(h.id), c = cat(a.c), s = stg(a.s);
    if (a.attn) ctxEl.classList.add('attn');
    K(a.attn ? 'ТРЕБУЕТ ВНИМАНИЯ' : c.n, monGlyph(a.c));
    T(a.n);
    if (a.attn) D(a.attn);
    R2('РОЛЬ', a.role);
    R2('ЭФФЕКТ', a.ef);
    R2('БЛОК', a.unit && a.unit !== '—' ? a.unit : '');
    R2('СИСТЕМЫ', a.sys && a.sys !== '—' ? a.sys : c.sys);
    F(s.n + (s.lv !== '—' ? ' · ' + s.lv : ''), 'КЛИК — АНАТОМИЯ');
  } else if (h.kind === 'stage'){
    var s2 = stg(h.id), n = byStage[h.id];
    K('СТАДИЯ ЗРЕЛОСТИ', ringGlyph(h.id));
    T(s2.n.charAt(0) + s2.n.slice(1).toLowerCase(), s2.lv !== '—' ? s2.lv : '');
    D(s2.note);
    R2('АГЕНТОВ', n ? String(n) : 'ни одного');
    R2('ОТВЕЧАЕТ', RESP[h.id]);
    R2('РАДИУС', Math.round(st.R * s2.rf) + ' px');
    F('', n ? '' : 'КОЛЬЦО ПУСТО');
  } else if (h.kind === 'cat'){
    var c2 = cat(h.id), n2 = byCat[h.id].length;
    K('ПРОДУКТОВАЯ ЛИНЕЙКА', monGlyph(h.id));
    T(c2.n.charAt(0) + c2.n.slice(1).toLowerCase());
    D(c2.d);
    R2('АГЕНТОВ', String(n2));
    R2('ТИРАЖ', c2.tir);
    R2('СИСТЕМЫ', c2.sys);
    R2('СЕКТОР', Math.round(c2.aw) + '°');
    F('', 'ШИРИНА СЕКТОРА = ЧИСЛО АГЕНТОВ');
  } else {
    K('ЯДРО', sunGlyph());
    T('Синергия');
    D('Чем ближе агент к центру, тем он самостоятельнее: от заявки в реестре до автономной работы без участия сотрудника.');
    R2('АГЕНТОВ', String(A.length));
    R2('ЛИНЕЕК', String(CATS.length));
    R2('В РАБОТЕ', String(A.length - (byStage.reg || 0)));
    F('', 'ОБОРОТ КАРТЫ ' + SPIN_T + ' С');
  }
  ctxEl.classList.add('on');
}

stageEl.addEventListener('mousemove', function(e){
  if (st.narrow || st.mode !== 'eco') return;
  var q = stageXY(e);
  st.mx = e.clientX; st.my = e.clientY;
  setHover(hitTest(q[0], q[1]), 'map');
  if (st.hover) ctxPlace();
});
stageEl.addEventListener('mouseleave', function(){ setHover(null); });
stageEl.addEventListener('click', function(e){
  var q = stageXY(e);
  var h = hitTest(q[0], q[1]);
  if (!h) { if (st.narrow) closeSheet(); return; }
  if (h.kind === 'agent'){
    if (st.narrow) openSheet(h.id); else openAnat(h.id);
    return;
  }
  if (st.narrow) openSheetInfo(h);
});

/* ============================= ЦИКЛ ============================= */

function tick(now){
  var dt = Math.min(.05, (now - lastT)/1000); lastT = now;
  /* Геометрия пересчитывается в цикле: окно может измениться до того,
     как отработает resize, и тогда матрица осталась бы от прежнего размера. */
  if (window.innerWidth !== st.W || window.innerHeight !== st.H) {
    measure();
    if (st.mode === 'anat') paintAnat();
  }
  var frozen = st.mode !== 'eco' || st.narrow || st.hover != null;
  if (!frozen) spin = (spin + 360 / SPIN_T * dt) % 360;
  if (st.mode === 'eco' && !st.narrow) paint();
  raf = requestAnimationFrame(tick);
}

/* ============================= АНАТОМИЯ ============================= */

var anat = document.getElementById('anat');
var anatBox = document.getElementById('anatBox');
var anatSvg = document.getElementById('anatSvg');
var sheet = document.getElementById('sheet');
var acore = document.getElementById('acore');
var beat = document.getElementById('beat');
var backBtn = document.getElementById('back');
var ndEls = [], nlEls = [], cardEl = null;

function slotVal(a, k){
  var c = cat(a.c), s = stg(a.s);
  if (k==='role') return a.role || 'В стратегии не описана';
  if (k==='ef')   return a.ef || 'В стратегии не описан';
  if (k==='cat')  return c.n.charAt(0) + c.n.slice(1).toLowerCase() + ' · ' + c.tir;
  if (k==='st')   return s.n.charAt(0) + s.n.slice(1).toLowerCase() + (s.lv!=='—' ? ' · '+s.lv : '');
  if (k==='unit') return a.unit || 'Не указан';
  return a.sys || c.sys;
}
function slotLines(a, k){
  var c = cat(a.c), s = stg(a.s);
  if (k==='role') return a.role
    ? ['Агент работает на роль, а не на подразделение целиком.', a.role]
    : ['Роль сотрудника в стратегии не указана — агент назван только в продуктовой линейке.'];
  if (k==='ef') {
    var l = [];
    if (a.pr) l.push('Проблема. ' + a.pr);
    if (a.ac) l.push('Действие. ' + a.ac);
    l.push(a.ef
      ? 'Замер: базовый до старта пилота, контрольный — через три месяца после перевода в промышленную эксплуатацию.'
      : 'Плановый эффект не описан, поэтому агент не проходит приёмку и не переводится на L2.');
    return l;
  }
  if (k==='cat')  return [c.d, 'Тиражируемость: ' + c.tir + '.'];
  if (k==='st')   return [
    s.note,
    a.ev ? 'Подтверждение: ' + a.ev
         : 'Соответствие агента стадии не зафиксировано.',
    'Ответственный на этом этапе — ' + RESP[a.s].toLowerCase() + '.'
  ];
  if (k==='unit') return [
    a.unit && a.unit !== '—' ? a.unit : 'Блок внедрения не указан.',
    'Подразделение, где агент разворачивается. Тиражирование в смежные блоки — последний этап воронки внедрения.'
  ];
  return [a.sys || c.sys,
    'Без единого слоя MCP-коннекторов срок вывода агента определяет получение доступа к данным, а не разработка.'];
}

function buildAnat(a){
  anatSvg.textContent = '';
  ndEls.forEach(function(e){ e.remove(); }); ndEls = [];
  nlEls.forEach(function(e){ e.remove(); }); nlEls = [];
  if (cardEl) { cardEl.remove(); cardEl = null; }

  var defs = ns('defs');
  [['leaderA','#F2F0ED',.44],['leaderB','#F2F0ED',.16],['leaderC','#FF3B20',.62]].forEach(function(d){
    var g = ns('radialGradient');
    g.setAttribute('id',d[0]); g.setAttribute('gradientUnits','userSpaceOnUse');
    var s0 = ns('stop'); s0.setAttribute('offset','0.34');
    s0.setAttribute('stop-color',d[1]); s0.setAttribute('stop-opacity','0');
    var s1 = ns('stop'); s1.setAttribute('offset','1');
    s1.setAttribute('stop-color',d[1]); s1.setAttribute('stop-opacity',String(d[2]));
    g.appendChild(s0); g.appendChild(s1); defs.appendChild(g);
  });
  anatSvg.appendChild(defs);
  anatSvg._defs = defs;

  var bound = ns('circle'); bound.setAttribute('class','bound'); anatSvg.appendChild(bound);
  anatSvg._bound = bound;
  anatSvg._lines = [];
  SLOTS.forEach(function(){ var l = ns('line'); l.setAttribute('class','leader');
    anatSvg.appendChild(l); anatSvg._lines.push(l); });

  var c = cat(a.c), s = stg(a.s);
  acore.innerHTML =
    '<svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true" style="color:rgba(242,240,237,.9)">'+
      '<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.2"'+
        (a.thin ? ' stroke-dasharray="2.6 2.6"' : '')+'/>'+
      c.mon.map(function(d){ return '<path d="'+d+'" fill="none" stroke="currentColor" stroke-width="1.2" '+
        'stroke-linecap="round" stroke-linejoin="round"/>'; }).join('')+
    '</svg>'+
    '<div class="chip mono">'+c.n+'</div>'+
    '<div class="cl disp">'+a.n+'</div>';

  document.getElementById('fWhy').textContent = a.why || a.pr
    || 'Проблема, которую снимает агент, в стратегии не описана. До рабочей сессии с подразделением его нельзя ни приоритизировать, ни оценить.';
  var acT = a.ac ? (/[.!?]$/.test(a.ac) ? a.ac : a.ac + '.') + ' ' : '';
  var efT = a.ef ? 'Плановый эффект: ' + a.ef.charAt(0).toLowerCase() + a.ef.slice(1) + '.' : '';
  document.getElementById('fHow').textContent = a.how || (acT + efT)
    || 'Действие и плановый эффект в стратегии не описаны. Первый шаг воронки — дайджест ИИ-автоматизации и рабочая сессия с подразделением.';

  SLOTS.forEach(function(sl, i){
    var b = el('button','nd' + ((sl.k==='ef' && !a.ef) || (sl.k==='role' && !a.role) ? ' slot' : ''));
    b.type = 'button';
    b.setAttribute('aria-label', sl.t + ': ' + slotVal(a, sl.k));
    b.innerHTML = '<span class="dot"></span>';
    var hot = (sl.k === 'st' && a.attn);
    b.style.setProperty('--dc', hot ? 'var(--sol)' : 'rgba(242,240,237,.9)');
    b.style.setProperty('--dg', hot ? '0 0 16px rgba(255,59,32,.5)' : '0 0 12px rgba(242,240,237,.3)');
    b.addEventListener('click', function(){
      if (!st.narrow) return;
      var row = document.querySelectorAll('#slotList .sl')[i];
      if (!row) return;
      row.scrollIntoView({ behavior:'smooth', block:'center' });
      row.style.transition = 'background .6s var(--ease)';
      row.style.background = 'rgba(242,240,237,.07)';
      setTimeout(function(){ row.style.background = ''; }, 900);
    });
    b.addEventListener('mouseenter', function(){ if (!st.narrow) { st.hotSlot = sl.k; paintAnat(); } });
    b.addEventListener('mouseleave', function(){ st.hotSlot = null; paintAnat(); });
    b.addEventListener('focus', function(){ if (!st.narrow) { st.hotSlot = sl.k; paintAnat(); } });
    b.addEventListener('blur', function(){ st.hotSlot = null; paintAnat(); });
    b.style.animation = 'rise .5s var(--ease) '+(0.14 + i*0.055)+'s both';
    anatBox.appendChild(b); ndEls.push(b);

    var d = el('div','nlab');
    d.innerHTML = '<div class="t mono">'+sl.t+'</div><div class="v"></div>';
    d.querySelector('.v').textContent = slotVal(a, sl.k);
    if (hot) d.querySelector('.v').style.color = 'var(--sol)';
    d.style.animation = 'rise .5s var(--ease) '+(0.2 + i*0.055)+'s both';
    anatBox.appendChild(d); nlEls.push(d);
  });

  beat.style.animationDuration = s.T + 's';

  /* Тот же набор шести слотов списком — для телефона, где выноски не помещаются. */
  var list = document.getElementById('slotList');
  list.textContent = '';
  SLOTS.forEach(function(sl){
    var hotS = (sl.k === 'st' && a.attn);
    var d = el('div','sl' + (hotS ? ' hot' : ''));
    var tt = el('div','t mono'); tt.textContent = sl.t;
    var vv = el('div','v'); vv.textContent = slotVal(a, sl.k);
    var bb = el('div','b'); bb.textContent = slotLines(a, sl.k).join(' ');
    d.appendChild(tt); d.appendChild(vv); d.appendChild(bb);
    list.appendChild(d);
  });
}

function paintAnat(){
  var a = agent(st.focus); if (!a) return;
  /* Композиция анатомии держит собственную ширину: на широком экране
     фланги не уезжают к краям окна, а остаются при схеме. */
  var cx, cy, Rn;
  if (st.narrow) {
    cx = st.W/2; cy = st.box/2;
    Rn = Math.max(110, Math.min(st.W/2 - 30, st.box/2 - 30));
  } else {
    var contentW = Math.min(st.W - 80, 1820);
    Rn = Math.max(150, Math.min(contentW/2 - 300, st.H/2 - 118));
    cx = st.W/2; cy = st.H/2;
    var fL = document.querySelector('.flank.l'), fR = document.querySelector('.flank.r');
    var edge = Math.max(24, cx - contentW/2);
    fL.style.left = edge + 'px'; fL.style.right = 'auto';
    fR.style.right = edge + 'px'; fR.style.left = 'auto';
  }
  var r1 = st.narrow ? Rn*0.50 : Rn*0.40;
  var r2 = Rn*0.93;
  var cr = st.narrow ? Rn*0.44 : Rn*0.335;
  var br = st.narrow ? Rn*0.57 : Rn*0.46;

  anatSvg._defs.childNodes.forEach(function(g){
    g.setAttribute('cx',cx); g.setAttribute('cy',cy); g.setAttribute('r',Rn);
  });
  anatSvg._bound.setAttribute('cx',cx); anatSvg._bound.setAttribute('cy',cy);
  anatSvg._bound.setAttribute('r',Rn.toFixed(1));

  acore.style.width = (cr*2)+'px'; acore.style.height = (cr*2)+'px';
  acore.style.left = (cx-cr)+'px'; acore.style.top = (cy-cr)+'px';
  beat.style.width = (br*2)+'px'; beat.style.height = (br*2)+'px';
  beat.style.left = (cx-br)+'px'; beat.style.top = (cy-br)+'px';

  if (cardEl) { cardEl.remove(); cardEl = null; }

  SLOTS.forEach(function(sl, i){
    var th = sl.a * Math.PI/180, ux = Math.cos(th), uy = Math.sin(th);
    var nx = cx + Rn*ux, ny = cy + Rn*uy;
    var thin = (sl.k==='ef' && !a.ef) || (sl.k==='role' && !a.role);
    var hot = (sl.k==='st' && a.attn);

    var l = anatSvg._lines[i];
    l.setAttribute('x1',(cx+r1*ux).toFixed(1)); l.setAttribute('y1',(cy+r1*uy).toFixed(1));
    l.setAttribute('x2',(cx+r2*ux).toFixed(1)); l.setAttribute('y2',(cy+r2*uy).toFixed(1));
    l.setAttribute('stroke', hot ? 'url(#leaderC)' : (thin ? 'url(#leaderB)' : 'url(#leaderA)'));
    l.setAttribute('stroke-dasharray', thin ? '2 6' : 'none');

    ndEls[i].style.left = (nx-13).toFixed(1)+'px';
    ndEls[i].style.top  = (ny-13).toFixed(1)+'px';

    var d = nlEls[i];
    if (sl.pos==='top'){ d.style.left=(cx-130)+'px'; d.style.top=(ny-74)+'px'; d.style.width='260px'; d.style.textAlign='center'; }
    else if (sl.pos==='bot'){ d.style.left=(cx-130)+'px'; d.style.top=(ny+26)+'px'; d.style.width='260px'; d.style.textAlign='center'; }
    else if (sl.pos==='r'){ d.style.left=(nx+26).toFixed(0)+'px'; d.style.top=(ny-26).toFixed(0)+'px'; d.style.width='186px'; d.style.textAlign='left'; }
    else { d.style.left=(nx-212).toFixed(0)+'px'; d.style.top=(ny-26).toFixed(0)+'px'; d.style.width='186px'; d.style.textAlign='right'; }

    if (st.hotSlot === sl.k){
      var c = el('div','acard');
      c.innerHTML = '<div class="h mono">'+sl.t+'</div>';
      var b = el('div','b');
      slotLines(a, sl.k).forEach(function(t,j){
        var p = el('div'); p.textContent = t;
        if (j) p.style.marginTop = '9px';
        p.style.color = j ? 'var(--t3)' : 'var(--t2)';
        b.appendChild(p);
      });
      c.appendChild(b);
      if (sl.pos==='top'){ c.style.left=(cx-136)+'px'; c.style.top=(ny+30)+'px'; }
      else if (sl.pos==='bot'){ c.style.left=(cx-136)+'px'; c.style.top=Math.min(st.H-210,(ny+56))+'px'; }
      else if (sl.pos==='r'){ c.style.left=Math.min(st.W-292,(nx+218))+'px'; c.style.top=Math.max(16,(ny-70))+'px'; }
      else { c.style.left=Math.max(20,(nx-490))+'px'; c.style.top=Math.max(16,(ny-70))+'px'; }
      anatBox.appendChild(c); cardEl = c;
    }
  });
}

function openAnat(id){
  st.focus = id; st.mode = 'anat'; st.hotSlot = null; st.hoverAgent = null;
  buildAnat(agent(id));
  closeSheet();
  setHover(null);
  if (st.narrow) stageEl.style.display = 'none';
  stageEl.classList.add('back');
  anat.classList.add('on');
  backBtn.classList.add('on');
  document.getElementById('railL').classList.add('hide');
  document.getElementById('railR').classList.add('hide');
  document.querySelector('header').classList.add('hide');
  document.getElementById('modes').classList.add('hide');
  paintAnat();
  if (st.narrow) window.scrollTo(0,0);
}
function closeAnat(){
  st.focus = null; st.mode = 'eco'; st.hotSlot = null;
  if (st.narrow) { stageEl.style.display = ''; window.scrollTo(0,0); }
  stageEl.classList.remove('back');
  anat.classList.remove('on');
  backBtn.classList.remove('on');
  document.getElementById('railL').classList.remove('hide');
  document.getElementById('railR').classList.remove('hide');
  document.querySelector('header').classList.remove('hide');
  document.getElementById('modes').classList.remove('hide');
  paint();
}

/* --------- нижняя карточка агента: контекст под большой палец --------- */
function openSheet(id){
  var a = agent(id); if (!a) return;
  st.sheet = id;
  var body = document.getElementById('sheetBody');
  body.textContent = '';
  var c1 = el('div','c mono'); c1.textContent = cat(a.c).n;
  var c2 = el('div','n'); c2.textContent = a.n;
  var c3 = el('div','e'); c3.textContent = a.ef || 'Плановый эффект в стратегии не описан';

  var c4 = el('div','s mono');
  c4.textContent = stg(a.s).n + ' \u00b7 ' + stg(a.s).lv + (a.ev ? ' \u00b7 ПОДТВЕРЖДЕНО' : '');
  body.appendChild(c1); body.appendChild(c2); body.appendChild(c3);
  if (a.unit && a.unit !== '—') {
    var cu2 = el('div','e');
    cu2.style.color = 'var(--t3)'; cu2.style.fontSize = '11.5px';
    cu2.textContent = a.unit;
    body.appendChild(cu2);
  }
  body.appendChild(c4);
  document.getElementById('sheetGo').style.display = '';
  sheet.classList.add('on');
}
function closeSheet(){ st.sheet = null; sheet.classList.remove('on'); }

/* Кольцо и сектор на касании объясняют себя в той же нижней карточке. */
function openSheetInfo(h){
  var body = document.getElementById('sheetBody');
  body.textContent = '';
  var add = function(cls, txt, style){
    if (!txt) return;
    var e = el('div', cls); e.textContent = txt;
    if (style) e.setAttribute('style', style);
    body.appendChild(e);
  };
  if (h.kind === 'stage'){
    var s2 = stg(h.id), n = byStage[h.id] || 0;
    add('c mono', 'СТАДИЯ ЗРЕЛОСТИ · КОЛЬЦО');
    add('n', s2.n.charAt(0) + s2.n.slice(1).toLowerCase() + (s2.lv !== '—' ? ' · ' + s2.lv : ''));
    add('e', s2.note);
    add('s mono', (n ? n + ' АГЕНТОВ' : 'КОЛЬЦО ПУСТО') + ' · ОТВЕЧАЕТ — ' + RESP[h.id]);
  } else if (h.kind === 'cat'){
    var c2 = cat(h.id);
    add('c mono', 'ПРОДУКТОВАЯ ЛИНЕЙКА · СЕКТОР');
    add('n', c2.n.charAt(0) + c2.n.slice(1).toLowerCase());
    add('e', c2.d);
    add('e', c2.sys, 'color:var(--t3);font-size:11.5px');
    add('s mono', byCat[h.id].length + ' АГЕНТОВ · ТИРАЖ — ' + c2.tir.toUpperCase());
  } else {
    add('c mono', 'ЯДРО');
    add('n', 'Синергия');
    add('e', 'Чем ближе агент к центру, тем он самостоятельнее: от заявки в реестре до автономной работы без участия сотрудника.');
    add('s mono', A.length + ' АГЕНТОВ · ' + CATS.length + ' ЛИНЕЕК');
  }
  st.sheet = null;                 /* кнопка «анатомия» здесь ни к чему */
  document.getElementById('sheetGo').style.display = 'none';
  sheet.classList.add('on');
}

/* ============================= ПОКАЗАТЕЛИ ============================= */

var mx = document.getElementById('mx');

function buildMx(){
  var h = '';
  h += '<div class="mxh mono">ЦЕЛЕВЫЕ ПОКАЗАТЕЛИ 2026–2028</div>';
  h += '<div class="tg"><div class="tgr hd"><div>ПОКАЗАТЕЛЬ</div><div>2026</div><div>2027</div><div>2028</div></div>';
  TARGETS.forEach(function(t,i){
    h += '<div class="tgr"><div class="nmx">'+t.n+'</div>';
    t.v.forEach(function(v,j){
      h += '<div><div class="yr mono">'+[2026,2027,2028][j]+'</div>'+
           '<div class="vx mono" data-v="'+v+'" data-suf="'+(t.pc?NB+'%':'')+'" '+
             'data-d="'+(0.2+i*0.09+j*0.06)+'">'+v+(t.pc?NB+'%':'')+'</div>'+
           '<div class="bar'+(t.hot?' hot':'')+'"><i data-w="'+(v/t.max*100)+'" '+
           'data-d="'+(0.2+i*0.09+j*0.06)+'"></i></div></div>';
    });
    h += '</div>';
  });
  h += '</div>';

  h += '<div class="fn"><div class="mxh mono">ВОРОНКА ВНЕДРЕНИЯ · ЕДИНАЯ ДЛЯ ВСЕХ ПОДРАЗДЕЛЕНИЙ</div>';
  h += '<div class="steps">';
  FUNNEL.forEach(function(f,i){
    h += '<div class="stp'+(f.live?' live':'')+'"><div class="no mono">0'+(i+1)+'</div>'+
         '<div class="ti">'+f.t+'</div><div class="rs">'+f.r+'</div>'+
         '<div class="rp mono">'+f.p.toUpperCase()+'</div></div>';
  });
  h += '</div></div>';

  h += '<div class="cons">';
  CONS.forEach(function(c){
    h += '<div class="cn'+(c.hot?' hot':'')+'"><div class="cnh mono">'+c.h+'</div><p>'+c.p+'</p></div>';
  });
  h += '</div>';

  document.getElementById('mxin').innerHTML = h;
}

/* Цифры набираются к своему значению — вместе с полосой, тем же тактом. */
function runCounters(){
  document.querySelectorAll('#mx .vx').forEach(function(e){
    var target = parseFloat(e.dataset.v || '0');
    var suf = e.dataset.suf || '';
    var wait = parseFloat(e.dataset.d || '0') * 1000;
    if (document.hidden){ e.textContent = target + suf; return; }
    e.textContent = '0' + suf;
    var t0 = 0;
    function step(now){
      if (!t0) t0 = now + wait;
      var k = Math.min(1, Math.max(0, (now - t0) / 950));
      var ease = 1 - Math.pow(1 - k, 3);
      e.textContent = Math.round(target * ease) + suf;
      if (k < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

function runBars(){
  runCounters();
  var bars = document.querySelectorAll('#mx .bar i');
  bars.forEach(function(b){ b.style.transition = 'none'; b.style.width = '0'; });
  setTimeout(function(){
    bars.forEach(function(b){
      b.style.transition = '';
      b.style.transitionDelay = b.dataset.d + 's';
      b.style.width = b.dataset.w + '%';
    });
  }, 40);
}

function setMode(m){
  if (st.focus) closeAnat();
  st.mode = m;
  document.querySelectorAll('#modes button').forEach(function(b){
    b.classList.toggle('on', b.dataset.mode === m);
  });
  var eco = m === 'eco';
  closeSheet();
  setHover(null);
  if (st.narrow) { stageEl.style.display = eco ? '' : 'none'; window.scrollTo(0,0); }
  stageEl.classList.toggle('back', !eco);
  mx.classList.toggle('on', !eco);
  document.getElementById('railL').classList.toggle('hide', !eco);
  document.getElementById('railR').classList.toggle('hide', !eco);
  if (!eco) runBars(); else paint();
}

/* ============================= ЗАПУСК ============================= */

function boot(){
  measure();
  buildRails();
  buildStage();
  buildMx();
  paint();
  lastT = performance.now();
  raf = requestAnimationFrame(tick);
}

window.addEventListener('resize', function(){
  measure();
  if (st.mode === 'anat') paintAnat(); else paint();
});

document.addEventListener('keydown', function(e){
  if (e.key !== 'Escape') return;
  if (st.sheet) { closeSheet(); return; }
  if (st.focus) { closeAnat(); return; }
  if (st.mode !== 'eco') { setMode('eco'); return; }
  if (st.hoverAgent) { st.hoverAgent = null; paint(); return; }
  if (st.hover) { setHover(null); return; }
  if (st.pick) { st.pick = null; axisSync(); paint(); }
});

document.querySelectorAll('#modes button').forEach(function(b){
  b.addEventListener('click', function(){ setMode(b.dataset.mode); });
});
(function(){
  var railL = document.getElementById('railL');
  railL.addEventListener('mouseenter', function(){ st.overAxis = true; axisSync(); });
  railL.addEventListener('mouseleave', function(){ st.overAxis = false; axisSync(); });
})();

backBtn.addEventListener('click', closeAnat);
document.getElementById('sheetClose').addEventListener('click', closeSheet);
document.getElementById('sheetGo').addEventListener('click', function(){
  if (st.sheet) openAnat(st.sheet);
});

if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ measure(); paint(); });
boot();
</script>
